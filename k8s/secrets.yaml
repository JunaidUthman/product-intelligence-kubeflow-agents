apiVersion: v1
kind: Secret
metadata:
  name: product-intel-secrets
  namespace: kubeflow
type: Opaque
stringData:
  # Once you run `terraform apply`, Terraform will spit out the `rds_endpoint`.
  # Paste that endpoint here (remove the :3306 part if it has it).
  MYSQL_HOST: "PLACEHOLDER_RDS_ENDPOINT_FROM_TERRAFORM"
  MYSQL_USER: "admin"
  MYSQL_DATABASE: "product_intelligence"
  
  # Terraform will also spit out `rds_password`. Paste it here.
  MYSQL_PASSWORD: "PLACEHOLDER_RDS_PASSWORD_FROM_TERRAFORM"
  
  # Your external APIs
  DEEPSEEK_API_KEY: "YOUR_DEEPSEEK_API_KEY"
  HF_TOKEN: "YOUR_HUGGINGFACE_TOKEN"
  HF_REPO_ID: "JunaidUTH/product-price-evolution"
