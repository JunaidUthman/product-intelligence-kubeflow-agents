name: Pipeline CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    
    # We need permissions to push commits back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short Git SHA for tagging
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          IMAGE_TAG: ${{ secrets.DOCKERHUB_USERNAME }}/product-intel-agents:v-${{ steps.vars.outputs.sha_short }}
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install KFP SDK
        run: pip install kfp kfp-kubernetes==1.1.0

      - name: Compile KFP Pipeline YAML
        env:
          # Pass the newly built image tag to the Python script!
          PIPELINE_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/product-intel-agents:v-${{ steps.vars.outputs.sha_short }}
        run: |
          python3 src/pipeline/kfp_pipeline.py

      - name: Commit and push updated YAML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add product_intel_pipeline.yaml
          
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(ci): auto-update pipeline yaml with image v-${{ steps.vars.outputs.sha_short }}" && git push)